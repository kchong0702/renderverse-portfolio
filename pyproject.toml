[project]
name = "renderverse-workspace"
version = "0.1.0"
description = "NX Monorepo for the Renderverse portfolio"
readme = "README.md"
authors = [
    { name = "kchong0702", email = "kelvinchong.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/ezbot",
    "apps/ezcareer-harness",
    "apps/artifact-service",
    "packages/document-schema",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
executionEnvironments = [
    { root = "apps/artifact-service" },
    { root = "apps/ezcareer-harness" },
    { root = "apps/ezbot" },
    { root = "packages/document-schema/src" },
]
