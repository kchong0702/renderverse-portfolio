name: renderverse

include:
  - apps/ezbot-harness/docker-compose.yaml
  - apps/artifact-service/docker-compose.yaml

x-base: &base
  env_file:
    - .env

services:
  otel-collector:
    <<: *base
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: always
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      OTEL_COLLECTOR_CONFIG_EXPAND_ENV: "true"
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-dev}"
    ports:
      - "127.0.0.1:${COLLECTOR_OTLP_GRPC_HOST_PORT:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${COLLECTOR_OTLP_HTTP_HOST_PORT:-4318}:4318" # OTLP HTTP
      - "127.0.0.1:${COLLECTOR_HEALTH_CHECK_HOST_PORT:-13133}:13133" # HEALTH CHECK
      - "127.0.0.1:${COLLECTOR_ZPAGES_HOST_PORT:-55679}:55679" # ZPAGES
      - "127.0.0.1:${COLLECTOR_SELF_METRICS_HOST_PORT:-8888}:8888" # collector self-metrics

  postgres:
    <<: *base
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ops}"
      POSTGRES_DB: "${POSTGRES_DB:-ops}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

volumes:
  postgres-data:

networks:
  default:
    name: renderverse
