extensions:
  health_check:
    endpoint: ${env:COLLECTOR_HEALTH_CHECK_ENDPOINT:-0.0.0.0:13133}

  pprof:
    endpoint: ${env:COLLECTOR_PPROF_ENDPOINT:-0.0.0.0:1777}

  zpages:
    endpoint: ${env:COLLECTOR_ZPAGES_ENDPOINT:-0.0.0.0:55679}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:COLLECTOR_OTLP_GRPC_ENDPOINT:-0.0.0.0:4317}
        max_recv_msg_size_mib: ${env:COLLECTOR_OTLP_MAX_RECV_MSG_SIZE_MIB:-32}

      http:
        endpoint: ${env:COLLECTOR_OTLP_HTTP_ENDPOINT:-0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: ${env:COLLECTOR_PROCESSORS_MEMORY_LIMITER_CHECK_INTERVAL:-2s}
    limit_percentage: ${env:COLLECTOR_PROCESSORS_MEMORY_LIMITER_LIMIT_PERCENTAGE:-80}
    spike_limit_percentage: ${env:COLLECTOR_PROCESSORS_MEMORY_LIMITER_SPIKE_LIMIT_PERCENTAGE:-25}

  resourcedetection:
    detectors: [env, system]
    timeout: ${env:COLLECTOR_PROCESSORS_RESOURCE_DETECTION_TIMEOUT:-2s}
    override: ${env:COLLECTOR_PROCESSORS_RESOURCE_DETECTION_OVERRIDE:-false}

  resource/env:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert

  batch:
    timeout: ${env:COLLECTOR_PROCESSORS_BATCH_TIMEOUT:-5s}
    send_batch_size: ${env:COLLECTOR_PROCESSORS_SEND_BATCH_SIZE:-1024}
    send_batch_max_size: ${env:COLLECTOR_PROCESSORS_SEND_BATCH_MAX_SIZE:-2048}

exporters:
  debug:
    verbosity: ${env:COLLECTOR_EXPORTERS_DEBUG_VERBOSITY:-basic}

service:
  extensions: [health_check, pprof, zpages]

  telemetry:
    logs:
      level: ${env:COLLECTOR_SERVICE_TELEMETRY_LOGS_LEVEL:-info}

    metrics:
      level: ${env:COLLECTOR_SERVICE_METRICS_LEVEL:-detailed}
      address: ${env:COLLECTOR_SERVICE_METRICS_ADDRESS:-0.0.0.0:8888}

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/env, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/env, batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/env, batch]
      exporters: [debug]
