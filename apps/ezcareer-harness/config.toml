job_sources = ["jsearch"]
harness_profiles = "harness_profiles.yaml"

[app]
name = "ezcareer-harness"
env = "dev"
version = "0.1.0"
cors_origin = "http://localhost:5174"
route_prefix = "/ezcareer"

host = "127.0.0.1"
port = 8200
workers = 1
log_level = "info"
access_log = true

[observability]
service_name = "ezcareer-harness"
log_level = "INFO"
log_format = "console"

tracing_enabled = false
metrics_enabled = false
instrumentations = ["langchain"]

[observability.trace_redaction]
hide_inputs = false
hide_outputs = false

[[agents]]
name = "job-finder"
path = "src/agents/job_finder/profile.yaml"
family = "glm"
model = "glm-5.3"

[[agents]]
name = "career-consultant"
path = "src/agents/career_consultant/profile.yaml"
family = "openai"
model = "gpt-6-luna"

[[agents]]
name = "career-director"
path = "src/agents/career_director/profile.yaml"
family = "openai"
model = "gpt-6-luna"

[[graph_profiles]]
name = "analyse-job"
path = "src/features/analyse_job/harness/configurations.yaml"

[[graph_profiles]]
name = "find-jobs"
path = "src/features/find_jobs/harness/configurations.yaml"

[[graph_profiles]]
name = "write-document"
path = "src/features/write_document/harness/configurations.yaml"
