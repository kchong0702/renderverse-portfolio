[project]
name = "ezcareer-harness"
version = "0.1.0"
description = "Career management agent harness"
authors = [
    { name = "kchong0702", email = "kelvinchong.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "document-schema",
    "html-text>=0.7.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.12",
    "openinference-instrumentation-langchain>=0.1.78",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "deepagents>=0.7.32",
    "langchain-openai>=1.7.2",
    "pyyaml>=6.0.3",
    "a2a-sdk[http-server]>=1.3.0",
    "dependency-injector>=4.49.1",
    "circuitbreaker>=2.1.3",
    "tenacity>=9.1.4",
]

[tool.uv.sources]
document-schema = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["a2a"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pyright]
venvPath = "../.."
venv = ".venv"
typeCheckingMode = "off"
reportImplicitOverride = "error"
