x-build: &build
  context: ../..
  dockerfile: apps/ezbot-harness/Dockerfile

services:
  laya:
    image: ezbot-laya:${TAG:-dev}
    build:
      <<: *build
      target: laya
    restart: always
    environment:
      LAYA_THREADS: "${LAYA_THREADS:-2}"
    ports:
      - "127.0.0.1:${LAYA_HOST_PORT:-8001}:8000"

  ezbot:
    image: ezbot:${TAG:-dev}
    build:
      <<: *build
      target: ezbot
    restart: always
    depends_on:
      - laya
    env_file:
      - path: .env
        required: false
    environment:
      EZBOT_INTENT__URL: http://laya:8000
      EZBOT_OBSERVABILITY__OTLP_ENDPOINT: http://otel-collector:4318
      EZBOT_RATE_LIMIT__CLIENT_IP_HEADER: cf-connecting-ip
    ports:
      - "127.0.0.1:${EZBOT_HOST_PORT:-8000}:8000"
