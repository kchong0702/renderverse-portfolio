[project]
name = "folio"
version = "0.1.0"
description = "Career management agent harness"
authors = [
    { name = "kchong0702", email = "kelvinchong.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
# `src` is this app's package; declared so imports sort the same whether Ruff
# runs here (nx lint) or from the workspace root (lint-staged)
known-first-party = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
