[app]
name = "artifact-service"
env = "dev"
version = "0.1.0"
cors_origin = "http://localhost:5174"
route_prefix = "/artifact-service"

host = "127.0.0.1"
port = 8210
workers = 1
log_level = "info"
access_log = true

[observability]
service_name = "artifact-service"
log_level = "INFO"
log_format = "console"

tracing_enabled = false
metrics_enabled = false

