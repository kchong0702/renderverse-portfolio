[project]
name = "ezbot"
version = "0.1.0"
description = "LangGraph chatbot for the Renderverse portfolio"
authors = [
    { name = "kchong0702", email = "kelvinchong.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.49.1",
    "fastapi>=0.142.2",
    "langgraph>=1.2.12",
    "openinference-instrumentation-langchain>=0.1.78",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
