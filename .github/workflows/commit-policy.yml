name: Commit Policy

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commits:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check commits (no AI attribution, Conventional Commits)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$(printf '%s' "$BEFORE" | tr -d 0)" ]; then
            # New branch: check every commit not already on the default branch
            RANGE="origin/$DEFAULT_BRANCH..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          node scripts/workflows/check-ai-attribution.mjs --range "$RANGE"

      - name: Check PR title and description (no AI attribution)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/workflows/check-ai-attribution.mjs --pr
