name: Lint & Format

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-packages --locked

      - name: Check formatting (Prettier + Ruff)
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: |
          npm ci
          uv sync --all-packages --locked

      - name: Lint (ESLint + Ruff)
        run: npx nx run-many -t lint

      - name: Typecheck (TypeScript)
        run: npx nx run-many -t typecheck
