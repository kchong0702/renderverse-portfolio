services:
  ops-api:
    environment: &ops-api-database
      OPS_API_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@postgres:5432/${POSTGRES_DB:-ops}

  ops-worker:
    environment: *ops-api-database

  ezcareer-harness:
    environment:
      EZCAREER_HARNESS_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@postgres:5432/${POSTGRES_DB:-ops}
